<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园 AI 助手</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🎓 校园 AI 助手</h1>
      <p class="subtitle">报到 · 选课 · 宿舍 · 图书馆，校园事随便问</p>
      <button id="new-chat" title="开始新对话">新对话</button>
    </header>

    <main id="chat-box">
      <div class="msg assistant">
        你好，我是校园 AI 助手 👋<br>
        可以问我：新生报到要带什么材料？怎么选课？宿舍几点熄灯？图书馆几点关门？
      </div>
    </main>

    <footer>
      <input id="input" type="text"
             placeholder="比如：新生报到要带什么材料？"
             autocomplete="off">
      <button id="send">发送</button>
    </footer>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
